controller_manager:
  ros__parameters:
    update_rate: 50

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    omni_wheel_controller:
      type: omni_wheel_controller/OmniWheelController

joint_state_broadcaster:
  ros__parameters:
    use_local_topics: false

omni_wheel_controller:
  ros__parameters:
    wheel_offset: 1.5708
    wheel_radius: 0.02
    robot_radius: 0.15
    wheel_names: ["w0_Hub_joint", "w1_Hub_joint", "w2_Hub_joint"]
    open_loop: true
